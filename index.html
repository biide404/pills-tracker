<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💊</title>
    <style>
        :root {
            --primary-color: #3498db;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; margin-top: 10px; }
        h1 { text-align: center; color: var(--primary-color); font-size: 28px; margin-bottom: 15px; }
        .med-card { background-color: var(--card-bg); border-radius: 12px; padding: 15px 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .med-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .med-name { font-weight: bold; font-size: 18px; color: var(--primary-color); }
        .stock-info { font-size: 15px; color: #555; }
        .stock-num { font-weight: bold; color: #333; font-size: 17px; }
        
        .row-action { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 12px; }
        .extra-controls { display: flex; align-items: center; gap: 8px; }
        .btn-mini { background: #e0e0e0; border: none; width: 30px; height: 30px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-mini:active { background: #ccc; }
        .extra-num { font-weight: bold; color: #e74c3c; min-width: 20px; text-align: center; font-size: 16px; }

        .check-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold; color: #27ae60; font-size: 15px; user-select: none; }
        .check-label input { width: 20px; height: 20px; accent-color: #2ecc71; cursor: pointer; }
        
        .btn-reset { background-color: #95a5a6; color: white; border: none; border-radius: 6px; padding: 10px 15px; font-size: 12px; width: 100%; cursor: pointer; margin-top: 10px; }
        .last-update { font-size: 10px; color: #999; text-align: center; margin-top: 8px; }
        #dateDisplay { text-align: center; font-size: 14px; color: #777; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>💊</h1>
    <div id="dateDisplay"></div>

    <div id="medList"></div>
    <button class="btn-reset" onclick="resetAllData()">重置所有库存数据（恢复备忘录原数）</button>
    <div class="last-update" id="lastUpdateDisplay"></div>
</div>

<script>
    const medications = [
        { id: 'vyvanse20', name: 'Vyvanse 20mg' },
        { id: 'vyvanse30', name: 'Vyvanse 30mg' },
        { id: 'lora', name: 'Lorazepam 劳拉 1mg' },
        { id: 'zopiclone', name: 'Zopiclone 佐匹 7.5mg' },
        { id: 'lamotrigine', name: 'Lamotrigine 拉莫 50mg' }
    ];

    // 严格对应你截图里备忘录的原始库存数字
    let stock = JSON.parse(localStorage.getItem('pillStock')) || {
        'vyvanse20': 22,
        'vyvanse30': 45,
        'lora': 41,
        'zopiclone': 33,
        'lamotrigine': 20
    };

    const todayStr = new Date().toLocaleDateString();
    let dailyRecord = JSON.parse(localStorage.getItem('pillDailyRecord')) || {};
    if (dailyRecord.date !== todayStr) {
        dailyRecord = { date: todayStr, items: {} };
    }

    function saveToStorage() {
        localStorage.setItem('pillStock', JSON.stringify(stock));
        localStorage.setItem('pillDailyRecord', JSON.stringify(dailyRecord));
        render();
    }

    function updateExtra(medId, delta) {
        if (!dailyRecord.items[medId]) {
            dailyRecord.items[medId] = { checked: false, extra: 0 };
        }
        let item = dailyRecord.items[medId];
        let newExtra = Math.max(0, item.extra + delta);
        let diff = newExtra - item.extra;

        if (diff !== 0) {
            item.extra = newExtra;
            stock[medId] = Math.max(0, (stock[medId] || 0) - diff);
            saveToStorage();
        }
    }

    function toggleCheck(medId) {
        if (!dailyRecord.items[medId]) {
            dailyRecord.items[medId] = { checked: false, extra: 0 };
        }
        dailyRecord.items[medId].checked = !dailyRecord.items[medId].checked;
        saveToStorage();
    }

    function resetAllData() {
        if (confirm("确定要重置所有药物库存到备忘录的原始数量吗？")) {
             localStorage.removeItem('pillStock');
             localStorage.removeItem('pillDailyRecord');
             location.reload();
        }
    }

    function render() {
        const medList = document.getElementById('medList');
        medList.innerHTML = '';

        medications.forEach(med => {
            const currentStock = stock[med.id] || 0;
            const record = dailyRecord.items[med.id] || { checked: false, extra: 0 };
            const extra = record.extra || 0;

            const card = document.createElement('div');
            card.className = 'med-card';
            card.innerHTML = `
                <div class="med-header">
                    <span class="med-name">${med.name}</span>
                    <span class="stock-info">剩余: <strong class="stock-num">${currentStock}</strong> 颗</span>
                </div>
                
                <div class="row-action">
                    <label class="check-label">
                        <input type="checkbox" ${record.checked ? 'checked' : ''} onclick="toggleCheck('${med.id}')">
                        <span>${record.checked ? '已打卡' : '打卡'}</span>
                    </label>

                    <div class="extra-controls">
                        <span style="font-size:13px; color:#666;">多吃:</span>
                        <button class="btn-mini" onclick="updateExtra('${med.id}', -1)">-</button>
                        <span class="extra-num">${extra}</span>
                        <button class="btn-mini" onclick="updateExtra('${med.id}', 1)">+</button>
                    </div>
                </div>
            `;
            medList.appendChild(card);
        });
        
        document.getElementById('dateDisplay').innerText = "今天是：" + todayStr;
        document.getElementById('lastUpdateDisplay').innerText = "数据实时自动保存";
    }

    render();
</script>

</body>
</html>

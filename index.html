<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日药量计算器</title>
    <style>
        :root {
            --primary-color: #3498db;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; margin-top: 20px; }
        h1 { text-align: center; color: var(--primary-color); font-size: 24px; margin-bottom: 20px; }
        .med-card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .med-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .med-name { font-weight: bold; font-size: 18px; color: var(--primary-color); }
        .daily-dose { font-size: 14px; color: #666; background: #eee; padding: 2px 6px; border-radius: 4px; }
        .controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .stock-display { font-size: 32px; font-weight: bold; text-align: center; flex: 1; }
        .btn-group { display: flex; flex-direction: column; gap: 5px; }
        button { border: none; border-radius: 6px; padding: 10px 15px; font-size: 16px; cursor: pointer; transition: background 0.2s; touch-action: manipulation; }
        .btn-add { background-color: #2ecc71; color: white; }
        .btn-add:active { background-color: #27ae60; }
        .btn-take { background-color: #e74c3c; color: white; }
        .btn-take:active { background-color: #c0392b; }
        .btn-reset { background-color: #95a5a6; color: white; font-size: 12px; padding: 5px 10px; margin-top: 10px; width: 100%;}
        .last-update { font-size: 10px; color: #999; text-align: center; margin-top: 5px; }
        #dateDisplay { text-align: center; font-size: 14px; color: #777; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>今日服药核对</h1>
    <div id="dateDisplay"></div>

    <div id="medList">
        <!-- 药品卡片将通过 JavaScript 动态生成 -->
    </div>
    <button class="btn-reset" onclick="resetAllData()">重置所有数据（慎点）</button>
    <div class="last-update" id="lastUpdateDisplay"></div>
</div>

<script>
    // 在这里配置你的药物信息
    const medications = [
        { id: 'vyvanse20', name: 'Vyvanse 20mg', daily: 1 },
        { id: 'vyvanse30', name: 'Vyvanse 30mg', daily: 1 },
        { id: 'lora', name: '劳拉 1mg', daily: 1 },
        { id: 'zopiclone', name: '佐匹克隆 7.5mg', daily: 1 },
        { id: 'lamotrigine', name: '拉莫三嗪 50mg', daily: 2 }
    ];

    // 初始化库存数据（从本地存储读取或使用默认值）
    let stock = JSON.parse(localStorage.getItem('pillStock')) || {
        'vyvanse20': 20,
        'vyvanse30': 30,
        'lora': 31,
        'zopiclone': 30,
        'lamotrigine': 60
    };
    let lastUpdate = localStorage.getItem('pillLastUpdate') || new Date().toLocaleDateString();

    function saveToLocalStorage() {
        localStorage.setItem('pillStock', JSON.stringify(stock));
        lastUpdate = new Date().toLocaleDateString();
        localStorage.setItem('pillLastUpdate', lastUpdate);
        render();
    }

    function updateStock(medId, change) {
        stock[medId] = Math.max(0, (stock[medId] || 0) + change);
        saveToLocalStorage();
    }

    function resetAllData() {
        if (confirm("确定要重置所有药物库存到初始值吗？")) {
             localStorage.removeItem('pillStock');
             localStorage.removeItem('pillLastUpdate');
             location.reload();
        }
    }

    function render() {
        const medList = document.getElementById('medList');
        medList.innerHTML = '';

        medications.forEach(med => {
            const currentStock = stock[med.id] || 0;
            const card = document.createElement('div');
            card.className = 'med-card';
            card.innerHTML = `
                <div class="med-header">
                    <span class="med-name">${med.name}</span>
                    <span class="daily-dose">每日 ${med.daily} 颗</span>
                </div>
                <div class="controls">
                    <button class="btn-take" onclick="updateStock('${med.id}', -${med.daily})" ${currentStock < med.daily ? 'disabled' : ''}>扣减今日药量</button>
                    <div class="stock-display">${currentStock}</div>
                    <button class="btn-add" onclick="updateStock('${med.id}', 1)">+1 颗</button>
                </div>
            `;
            medList.appendChild(card);
        });
        
        document.getElementById('dateDisplay').innerText = "今天是：" + new Date().toLocaleDateString();
        document.getElementById('lastUpdateDisplay').innerText = "数据最后更新：" + lastUpdate;
    }

    // 检查是否是新的一天，如果是，自动提示扣减（可选功能，此处简化）
    // 简单的实现：如果最后更新日期不是今天，提示用户核对。
    if (lastUpdate !== new Date().toLocaleDateString()) {
         // 这里可以添加自动逻辑或提示，此处为了简洁省略，用户手动点击扣减。
    }

    render();
</script>

</body>
</html>

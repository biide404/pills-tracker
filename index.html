<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rio</title>
    <style>
        :root {
            --primary-color: #3498db;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; margin-top: 20px; }
        h1 { text-align: center; color: var(--primary-color); font-size: 24px; margin-bottom: 20px; }
        .med-card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; }
        .med-info { flex: 1; }
        .med-name { font-weight: bold; font-size: 18px; color: var(--primary-color); margin-bottom: 5px; }
        .med-details { font-size: 14px; color: #666; display: flex; gap: 10px; align-items: center; }
        .daily-dose { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        .stock-num { font-weight: bold; color: #333; }
        
        /* 样式：打卡勾选框 */
        .check-container { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 16px; font-weight: bold; color: #27ae60; background: #e8f8f5; padding: 10px 15px; border-radius: 8px; border: 2px solid #2ecc71; user-select: none; }
        .check-container input { width: 20px; height: 20px; cursor: pointer; accent-color: #2ecc71; }
        .med-card.checked { background-color: #f9f9f9; opacity: 0.7; }
        .med-card.checked .med-name { text-decoration: line-through; color: #888; }

        .btn-add { background-color: #2ecc71; color: white; border: none; border-radius: 6px; padding: 8px 12px; font-size: 14px; cursor: pointer; margin-top: 5px; }
        .btn-reset { background-color: #95a5a6; color: white; border: none; border-radius: 6px; padding: 10px 15px; font-size: 12px; width: 100%; cursor: pointer; margin-top: 10px; }
        .last-update { font-size: 10px; color: #999; text-align: center; margin-top: 5px; }
        #dateDisplay { text-align: center; font-size: 14px; color: #777; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>rio'tracker</h1>
    <div id="dateDisplay"></div>

    <div id="medList">
        <!-- 药品卡片将通过 JavaScript 动态生成 -->
    </div>
    <button class="btn-reset" onclick="resetAllData()">重置所有库存数据（慎点）</button>
    <div class="last-update" id="lastUpdateDisplay"></div>
</div>

<script>
    const medications = [
        { id: 'vyvanse20', name: 'Vyvanse 20mg', daily: 1 },
        { id: 'vyvanse30', name: 'Vyvanse 30mg', daily: 1 },
        { id: 'lora', name: '劳拉 1mg', daily: 1 },
        { id: 'zopiclone', name: '佐匹克隆 7.5mg', daily: 1 },
        { id: 'lamotrigine', name: '拉莫三嗪 50mg', daily: 1 }
    ];

    let stock = JSON.parse(localStorage.getItem('pillStock')) || {
        'vyvanse20': 20,
        'vyvanse30': 30,
        'lora': 31,
        'zopiclone': 30,
        'lamotrigine': 60
    };

    // 记录每天的打卡状态
    const todayStr = new Date().toLocaleDateString();
    let checkedStatus = JSON.parse(localStorage.getItem('pillCheckedStatus')) || {};
    if (checkedStatus.date !== todayStr) {
        checkedStatus = { date: todayStr, items: {} }; // 新的一天自动重置勾选
    }

    function saveToLocalStorage() {
        localStorage.setItem('pillStock', JSON.stringify(stock));
        localStorage.setItem('pillCheckedStatus', JSON.stringify(checkedStatus));
        render();
    }

    function toggleCheck(medId, dailyDose) {
        const isChecked = !checkedStatus.items[medId];
        checkedStatus.items[medId] = isChecked;

        // 如果勾选了，库存自动减去每日剂量；如果取消勾选，库存加回来
        if (isChecked) {
            stock[medId] = Math.max(0, (stock[medId] || 0) - dailyDose);
        } else {
            stock[medId] = (stock[medId] || 0) + dailyDose;
        }
        saveToLocalStorage();
    }

    function addStock(medId) {
        stock[medId] = (stock[medId] || 0) + 1;
        saveToLocalStorage();
    }

    function resetAllData() {
        if (confirm("确定要重置所有药物库存到初始值吗？")) {
             localStorage.removeItem('pillStock');
             localStorage.removeItem('pillCheckedStatus');
             location.reload();
        }
    }

    function render() {
        const medList = document.getElementById('medList');
        medList.innerHTML = '';

        medications.forEach(med => {
            const currentStock = stock[med.id] || 0;
            const isChecked = !!checkedStatus.items[med.id];
            
            const card = document.createElement('div');
            card.className = `med-card ${isChecked ? 'checked' : ''}`;
            card.innerHTML = `
                <div class="med-info">
                    <div class="med-name">${med.name}</div>
                    <div class="med-details">
                        <span>剩余: <strong class="stock-num">${currentStock}</strong> 颗</span>
                        <span class="daily-dose">每日 ${med.daily} 颗</span>
                        <button class="btn-add" onclick="addStock('${med.id}')">+1库存</button>
                    </div>
                </div>
                <label class="check-container">
                    <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="toggleCheck('${med.id}', ${med.daily})">
                    <span>${isChecked ? '已吃' : '打卡'}</span>
                </label>
            `;
            medList.appendChild(card);
        });
        
        document.getElementById('dateDisplay').innerText = "今天是：" + todayStr;
        document.getElementById('lastUpdateDisplay').innerText = "数据实时自动保存";
    }

    render();
</script>

</body>
</html>
